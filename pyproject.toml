[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-origination-agents"
version = "0.1.0"
description = "LLM agent that screens buy-and-build acquisition targets from a company list: focused crawling, registry enrichment, structured scoring against an investment thesis, results written back to the sheet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Medina" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
sheets = ["gspread>=6.0"]
dev = ["pytest>=7", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
pe-origination = "pe_origination.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B023"]
